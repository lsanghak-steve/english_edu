<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등 필수 영단어 500선 - 3D 플래시카드</title>
    <meta name="description" content="500개 초등 필수 영단어와 핀터레스트 감성 이미지, 쉬운 예문으로 공부하는 3D 플래시카드 웹 앱">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 상단 헤더 & 컨트롤 -->
        <header class="app-header">
            <h1 class="app-title">✨ 초등 영단어 500선 플래시카드</h1>
            <div class="controls-row">
                <select id="categorySelect" class="select-category">
                    <option value="전체 보기">전체 보기</option>
                </select>
                <button id="shuffleBtn" class="btn-action">🎲 셔플</button>
            </div>
        </header>

        <!-- 3D 플래시카드 영역 -->
        <main class="card-scene">
            <div id="flashcard" class="flashcard">
                <!-- 카드 앞면 (영어 단어 + 500x500 감성 이미지 + 발음) -->
                <div class="card-face card-front">
                    <div class="card-img-wrapper">
                        <img id="wordImg" class="card-img" src="p_img/apple.png" alt="단어 이미지">
                    </div>
                    <div class="word-info">
                        <h2 id="wordEn" class="word-en">Apple</h2>
                        <p id="wordPhonics" class="word-phonics">[애플]</p>
                        <button id="audioBtn" class="audio-btn" title="발음 듣기">🔊</button>
                    </div>
                    <p class="flip-hint">👆 카드를 터치하면 뒤집혀요!</p>
                </div>

                <!-- 카드 뒷면 (한국어 뜻 + 초등 쉬운 예문) -->
                <div class="card-face card-back">
                    <h2 id="meaningKr" class="meaning-kr">사과</h2>
                    <div class="example-box">
                        <p id="exampleEn" class="example-en">I like sweet red apples.</p>
                        <p id="exampleKo" class="example-ko">나는 달콤한 빨간 사과를 좋아해요.</p>
                    </div>
                    <p class="flip-hint">👆 터치하면 앞면으로 돌아갑니다</p>
                </div>
            </div>
        </main>

        <!-- 하단 탐색 버튼 -->
        <footer class="nav-controls">
            <button id="prevBtn" class="btn-nav" title="이전 단어">◀</button>
            <span id="progressText" class="progress-text">1 / 500</span>
            <button id="nextBtn" class="btn-nav" title="다음 단어">▶</button>
        </footer>
    </div>

    <!-- 500개 단어 데이터 및 앱 동작 스크립트 -->
    <script src="words_data.js"></script>
    <script src="app.js"></script>
</body>
</html>
